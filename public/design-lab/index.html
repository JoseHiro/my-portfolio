<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Josey — 12 Design Studies</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#242722;font-family:Arial,'Helvetica Neue',sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #7765e6;outline-offset:5px}a{color:inherit;text-decoration:none}.lab{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;background:#22251ff2;color:#fff;border:1px solid #ffffff30;border-radius:20px;padding:12px 16px;box-shadow:0 10px 50px #0003;width:min(960px,94vw);backdrop-filter:blur(20px)}.lab-head{display:flex;align-items:center;justify-content:space-between;gap:15px;font-size:11px;letter-spacing:.08em}.lab-head span{color:#bcbfb5}.numbers{display:flex;gap:5px;margin-top:10px}.numbers button{flex:1;border:0;border-radius:8px;background:#ffffff0d;color:#aeb2a6;padding:10px 0;font-size:12px}.numbers button.active{background:#d9f59b;color:#222}.nav{height:96px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;font-size:12px;letter-spacing:.04em}.logo{font-size:22px;font-weight:bold;letter-spacing:-1px}.nav-links{display:flex;gap:30px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7d9c54;margin-right:7px}.hero{padding:45px 7vw 0;position:relative;min-height:700px}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase}.intro{display:flex;justify-content:space-between;align-items:end;gap:30px}h1{font-size:clamp(65px,9vw,144px);font-weight:500;line-height:.94;letter-spacing:-.075em;margin:28px 0}h1 em{font-family:Georgia,serif;font-weight:normal}.desc{max-width:270px;font-size:13px;line-height:1.9;color:#777b70}.stage{position:relative;min-height:380px;margin-top:40px;perspective:1200px}.card{display:block;position:relative;width:32%;border:0;text-align:left;background:#e8e9e2;padding:16px;border-radius:14px;transition:transform .6s,background .5s;box-shadow:0 20px 50px #2427220a;color:inherit}.card img{d der:1px solid #739780;box-shadow:0 0 80px #a8e9ac15}.constellation .card:nth-child(2){transform:translateY(-40px)}.constellation .stage:before{content:'';position:absolute;top:44%;left:10%;width:80%;height:1px;background:#8bb79a;transform:rotate(-8deg)}.stack .gallery{display:block;width:70%;margin:auto}.stack .card{width:100%;position:sticky;top:40px;margin-top:-110px;box-shadow:0 -8px 40px #0002}.stack .card:first-child{margin-top:0}.stack .card img{aspect-ratio:2.8}.stack .card:nth-child(2){transform:rotate(3deg)}.stack .card:nth-child(3){transform:rotate(-3deg)}.museum{background:#eceae4}.museum .gallery{align-items:start;padding-bottom:100px}.museum .card{padding:0;background:transparent;box-shadow:none;transform:rotateY(-12deg)}.museum .card:after{content:'';display:block;height:90px;margin:20px -15px 0;background:linear-gradient(100deg,#faf9f5,#d7d5cc);box-shadow:20px 30px 25px #0002;transform:skewY(-5deg)}.museum .card img{border:8px solid #fff;border-radius:0}.icons .gallery{justify-content:center;gap:7vw}.icons .card{width:20%;background:#ddd4f1;border-radius:35px;transform:rotate(-12deg);box-shadow:0 13px 0 #b3a1d1,0 30px 40px #51466522;padding:20px;touch-action:none;user-select:none}.icons .card:nth-child(2){background:#daebbb;box-shadow:0 13px 0 #a4ba80,0 30px 40px #51466522;transform:translateY(-30px) rotate(9deg)}.icons .card img{aspect-ratio:1;object-fit:cover;border-radius:20px;pointer-events:none}.canvas .stage{overflow-x:auto;padding-bottom:25px}.canvas .gallery{width:1400px;gap:60px;padding:20px}.canvas .card{width:380px;flex-shrink:0;transform:rotate(-5deg);background:#fff}.canvas .card:nth-child(2){transform:translateY(30px) rotate(7deg)}.world{background:#eee9fa}.world .gallery{justify-content:center}.world .card{border-radius:50% 50% 12px 12px;padding:35px 18px 18px;background:#d5c7ed;box-shadow:0 20px 0 #c2aedf}.world .card:nth-child(2){background:#c6d9bb;box-shadow:0 20px 0 #a5bf96}.world .card:nth-child(3){background:#edceaa;box-shadow:0 20px 0 #d5b48f}.mono{background:#efefed;transition:background .7s}.mono .card{background:#fff;filter:grayscale(1)}.mono .card:hover{filter:none}.play .stage{border-top:1px solid #ccc}.play .gallery{padding-top:60px}.play .card:nth-child(1){border-radius:50%;background:#d8f099;transform:rotate(-12deg)}.play .card:nth-child(2){border-radius:90px 10px;background:#c9bef0;transform:rotate(8deg)}.play .card:nth-child(3){border-radius:15px 90px;background:#efb798;transform:rotate(-6deg)}.play .card:active{scale:.9}.time{transition:background .7s,color .7s}.time.night{background:#18212f;color:#eef0f9}.time.night .card{background:#303d50;box-shadow:0 20px 60px #93a8ff15}.time.night .desc,.time.night .note{color:#a6b1c5}.time-control{display:flex;align-items:center;gap:15px;font-size:12px;margin-top:20px}.time input{accent-color:#8b9d60;width:190px}.orb{width:70px;height:70px;border-radius:50%;position:absolute;right:12%;top:30px;background:radial-gradient(circle at 30% 25%,#fff9cc,#e7b77b);box-shadow:0 0 70px #f6d99770}.night .orb{background:radial-gradient(circle at 30% 25%,#fff,#9aafda);box-shadow:0 0 70px #a7c5ff40}dialog{border:0;border-radius:20px;padding:25px;width:min(800px,90vw);background:#f8f7f3;color:#242722}dialog::backdrop{background:#17211fcc;backdrop-filter:blur(12px)}dialog img{width:100%;max-height:60vh;object-fit:contain;border-radius:10px}dialog .close{float:right;border:0;background:#e7e7df;border-radius:50%;width:34px;height:34px}.mobile-hint{display:none}@media(max-width:700px){.nav{height:75px}.nav-links{gap:14px}.nav-links .availability{display:none}.hero{padding-top:20px;min-height:650px}.intro{display:block}h1{font-size:76px}.desc{max-width:100%}.stage{min-height:260px}.gallery{gap:10px}.card{padding:7px;border-radius:8px}.card-label{font-size:9px;display:block}.card-label b{font-size:12px;display:block;margin-bottom:5px}.lab{bottom:8px;padding:11px}.lab-head{font-size:9px}.lab-head span{display:none}.numbers{gap:3px}.numbers button{font-size:10px;padding:11px 0}.desk .stage{padding:25px 10px;min-height:220px}.type .stage{margin-top:20px}.type .card{width:32%}.type .card:nth-child(2){transform:translateY(-30px)}.stack .gallery{width:95%}.stack .card{margin-top:-25px}.icons .card{width:29%;padding:10px;border-radius:20px}.museum .card:after{height:60px}.world .card{padding:20px 7px 7px}.constellation .card{width:31%}.orb{width:45px;height:45px;top:20px;right:9%}.time h1{font-size:68px}.note{padding-bottom:150px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div id="view"></div>
<aside class="lab" aria-label="デザイン案の切り替え"><div class="lab-head"><b id="concept"></b><span>DESIGN EXPLORATIONS / JOSEY</span><button class="pill" id="motion" style="color:white;border-color:#ffffff40;padding:5px 10px">動き OFF</button></div><nav class="numbers" aria-label="12個のコンセプト"></nav></aside>
<dialog id="detail"><button class="close" aria-label="閉じる">×</button><p class="eyebrow">Selected project / UI study</p><h2 id="detail-title"></h2><img id="detail-img" alt=""><p>実際の作品画像を使ったデザインモックです。作品カードを選択したときの表示例。</p></dialog>
<script>
const concepts=[
['floating','浮遊するアプリギャラリー','A little space.<br>A lot of <em>ideas.</em>','余白のなかに、アイデアが浮かぶ。','画面がふわりと浮くギャラリー。カードを選ぶと作品を拡大できます。'],
['desk','デジタルな作業机','Welcome to<br>my <em>workbench.</em>','つくる、試す。またつくる。','斜めから眺める小さな作業机。CSSの立体表現で奥行きを試しています。'],
['type','巨大な文字 × 小さな遊び','MAKE<br><em>some</em>THING.','小さな好奇心を、動くものに。','大胆な文字と、隙間で遊ぶ作品たち。文字と作品の大きさの対比を楽しむ案。'],
['constellation','アプリの星座','Connected by<br><em>curiosity.</em>','ひとつの好奇心から、次のアイデアへ。','作品が点と線でつながる夜の空間。カードに触れると星を拾うように作品を見られます。'],
['stack','積み重なるカード','One idea.<br>Then <em>another.</em>','積み重ねてきた、アイデアの記録。','スクロールで重なりを眺めるカード構成。選択したカードは拡大して読めます。'],
['museum','ミニチュア美術館','Small works.<br><em>Open</em> minds.','日常に、ちいさな発見を。','台座、柔らかな影、作品だけの展示室。カードに触れると展示を近くで見られます。'],
['icons','触れるアプリアイコン','Good things.<br>Small <em>packages.</em>','触って、動かして、見つけよう。','アイコンをドラッグできます。クリックすると作品が開きます。'],
['canvas','一本の長いキャンバス','An ongoing<br><em>sketchbook.</em>','完成も、途中も。すべて制作の一部。','作品エリアを横にスクロール。自由に広がるスケッチブックのような構成。'],
['world','一作品、一つの世界','Every app,<br>a new <em>world.</em>','アイデアごとに、違う景色。','作品を選ぶと背景がその作品の色に変化。小さな世界へ入る構成のモック。'],
['mono','モノクロ＋反応する一色','Less noise.<br>More <em>feeling.</em>','色は、触れた瞬間に。','カードにポインターを重ねるかフォーカスすると、作品の色が画面に広がります。'],
['play','小さなプレイグラウンド','Serious craft.<br><em>Playful</em> heart.','ちゃんとつくる。たのしくつくる。','丸や曲線、少しの傾き。カードを押すと縮み、離すと戻る触り心地。'],
['time','時間で変わるポートフォリオ','A different light.<br>The same <em>curiosity.</em>','朝も、夜も。つくることは続く。','スライダーで昼と夜を切り替え。作品と余白はそのまま、空間の光が変わります。']];
const projects=[['Ventri','Ventri_thumbnail.webp','#e5dcef'],['Nihonkun','nihonkun_thumbnail.webp','#dce8c9'],['Seekr','seekr_thumbnail.webp','#f0dcc4']];
let current=0,motion=true;const view=document.querySelector('#view'),nav=document.querySelector('.numbers'),modal=document.querySelector('dialog');
concepts.forEach((c,i)=>{const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0');b.title=c[1];b.setAttribute('aria-label',`${i+1}. ${c[1]}`);b.onclick=()=>render(i);nav.append(b)});
function render(i){current=i;const c=concepts[i];document.body.className=c[0];document.body.style.background='';document.querySelector('#concept').textContent=`${String(i+1).padStart(2,'0')} / ${c[1]}`;[...nav.children].forEach((b,j)=>{b.classList.toggle('active',j===i);b.setAttribute('aria-current',j===i?'true':'false')});view.innerHTML=`<header class="nav"><a class="logo" href="#" aria-label="最初の案へ">josey<span style="color:#8a9d69">.</span></a><nav class="nav-links"><a href="#works">Selected work ↗</a><span class="availability"><span class="dot"></span>Portfolio / concept study</span></nav></header><main><section class="hero"><div class="eyebrow">Independent developer & curious maker / Design study ${String(i+1).padStart(2,'0')}</div>${i===11?'<div class="orb"></div>':''}<div class="intro"><h1>${c[2]}</h1><div class="desc">${c[3]}<br>日々のアイデアを、<br>触れて楽しめる体験に。${i===11?'<label class="time-control">☀ <input aria-label="昼と夜の切り替え" type="range" min="0" max="100" value="10"> ☾</label>':''}</div></div><div class="section-line" id="works"><span>SELECTED EXPERIMENTS</span><span>EXPLORE THE COLLECTION ↙</span></div><div class="stage"><div class="gallery">${projects.map((p,j)=>`<button class="card" data-project="${j}" aria-label="${p[0]} の画面を開く"><img src="/img/thumbnails/${p[1]}" alt="${p[0]} アプリの画面" draggable="false"><div class="card-label"><b>${p[0]}</b><span>0${j+1} ↗</span></div></button>`).join('')}</div></div></section><footer class="note"><span class="eyebrow">ABOUT THIS DIRECTION</span><p>${c[4]}</p><p>12案のUIスタディ · 内容・コピーは構成検討用です · 立体表現はCSSによるモック</p></footer></main>`;
view.querySelector('.logo').onclick=e=>{e.preventDefault();render(0)};
view.querySelectorAll('.card').forEach((card,j)=>{let dragged=false,startX=0,startY=0;card.onclick=()=>{if(dragged)return;if(i===8)document.body.style.background=projects[j][2];document.querySelector('#detail-title').textContent=projects[j][0];document.querySelector('#detail-img').src='/img/thumbnails/'+projects[j][1];document.querySelector('#detail-img').alt=projects[j][0]+' アプリ画面';modal.showModal()};if(i===9){const color=()=>document.body.style.background=projects[j][2];card.onpointerenter=color;card.onfocus=color;card.onpointerleave=()=>document.body.style.background='';card.onblur=()=>document.body.style.background=''}if(i===6){card.onpointerdown=e=>{dragged=false;startX=e.clientX;startY=e.clientY;card.setPointerCapture(e.pointerId)};card.onpointermove=e=>{if(!card.hasPointerCapture(e.pointerId))return;const x=e.clientX-startX,y=e.clientY-startY;if(Math.abs(x)+Math.abs(y)>8)dragged=true;card.style.translate=`${x}px ${y}px`};card.onpointerup=card.onpointercancel=()=>{card.style.translate='0 0'}}});const range=view.querySelector('input');if(range)range.oninput=()=>document.body.classList.toggle('night',+range.value>50);location.hash=String(i+1);window.scrollTo({top:0,behavior:'instant'})}
document.querySelector('.close').onclick=()=>modal.close();modal.onclick=e=>{if(e.target===modal)modal.close()};document.querySelector('#motion').onclick=()=>{motion=!motion;document.querySelector('#motion').textContent=motion?'動き OFF':'動き ON';document.querySelector('#stop-motion').textContent=motion?'':'*,*:before,*:after{animation:none!important;transition:none!important}'};const style=document.createElement('style');style.id='stop-motion';document.head.append(style);const initial=Number(location.hash.slice(1));render(initial>=1&&initial<=12?initial-1:0);window.addEventListener('hashchange',()=>{const n=Number(location.hash.slice(1));if(n>=1&&n<=12&&n-1!==current)render(n-1)});
</script></body></html>
